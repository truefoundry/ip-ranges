name: Validate

on:
  pull_request:
    paths:
      - "global/**"
      - "us/**"
      - ".github/schema/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "global/**"
      - "us/**"
      - ".github/schema/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # ubuntu-latest, never the static-IP runner groups: a fork PR's copy of this
    # file picks its own runs-on, and the org IP allow list trusts those IPs.
    runs-on: ubuntu-latest
    steps:
      # Anonymous on purpose. The repo is public, and an authenticated checkout
      # from a standard runner gets a 403 from the org IP allow list.
      - name: Check out (anonymous)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags --depth=1 origin "+${GITHUB_SHA}:refs/remotes/origin/ci"
          git checkout -q --detach origin/ci

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate source files
        run: uv run .github/scripts/validate.py

      - name: Build artifacts
        run: uv run .github/scripts/build.py --version 0.0.0-ci

  diff:
    # Show reviewers exactly which IPs a PR adds or removes, so nobody has to read raw JSON.
    # Informational only: `validate` is the gate, so a baseline that cannot be rebuilt
    # (an old branch, a schema change) must never block the PR.
    #
    # Builds the comment but does not post it: a fork PR's run has neither a write
    # token nor an allow-listed IP. pr-diff-comment.yml posts it, running from main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      # Anonymous, as in `validate`. Full history plus the base branch, which the
      # baseline build below reads as origin/<base>.
      - name: Check out (anonymous)
        run: |
          git init -q .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch -q --no-tags origin \
            "+${GITHUB_SHA}:refs/remotes/origin/ci" \
            "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
          git checkout -q --detach origin/ci

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build this branch
        run: |
          uv run .github/scripts/build.py --version "pr-${{ github.event.pull_request.number }}"
          cp dist/global.json dist/us.json "${RUNNER_TEMP}/"

      - name: Build the base branch
        run: |
          # Older bases used eu/ instead of global/. An empty baseline still produces a
          # useful "everything added" comment instead of failing the checkout.
          mkdir -p "${RUNNER_TEMP}/old"
          base="origin/${{ github.base_ref }}"
          if git cat-file -e "${base}:global/ip-ranges.json" \
            && git cat-file -e "${base}:us/ip-ranges.json"; then
            git checkout "$base" -- global us
            uv run .github/scripts/build.py --version "${{ github.base_ref }}"
            cp dist/global.json dist/us.json "${RUNNER_TEMP}/old/"
            git checkout HEAD -- global us
          elif git cat-file -e "${base}:eu/ip-ranges.json" \
            && git cat-file -e "${base}:us/ip-ranges.json"; then
            git checkout "$base" -- eu us
            mkdir -p global
            cp eu/ip-ranges.json global/ip-ranges.json
            uv run .github/scripts/build.py --version "${{ github.base_ref }}"
            cp dist/global.json dist/us.json "${RUNNER_TEMP}/old/"
            git checkout HEAD -- global us
            rm -rf eu
          else
            echo "Base branch has no global/ or us/ ip-ranges yet; diffing against an empty list."
            printf '%s\n' '{"endpoints":[]}' > "${RUNNER_TEMP}/old/global.json"
            printf '%s\n' '{"endpoints":[]}' > "${RUNNER_TEMP}/old/us.json"
          fi

      - name: Render diff
        run: |
          uv run .github/scripts/release_notes.py \
            --version "pr-${{ github.event.pull_request.number }}" \
            --global "${RUNNER_TEMP}/global.json" \
            --us "${RUNNER_TEMP}/us.json" \
            --old-global "${RUNNER_TEMP}/old/global.json" \
            --old-us "${RUNNER_TEMP}/old/us.json" \
            --out "${RUNNER_TEMP}/diff.md"

          {
            echo "<!-- ip-ranges-diff -->"
            echo "## Proposed IP changes"
            echo
            tail -n +2 "${RUNNER_TEMP}/diff.md"
          } > "${RUNNER_TEMP}/comment.md"

      - name: Record the PR number for pr-diff-comment.yml
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > "${RUNNER_TEMP}/pr-number"

      - name: Hand the comment to pr-diff-comment.yml
        uses: actions/upload-artifact@v4
        with:
          name: ip-ranges-diff
          path: |
            ${{ runner.temp }}/comment.md
            ${{ runner.temp }}/pr-number
          if-no-files-found: error
          retention-days: 1
