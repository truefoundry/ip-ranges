name: Validate

on:
  pull_request:
    paths:
      - "eu/**"
      - "us/**"
      - ".github/schema/**"
      - ".github/scripts/**"
      - ".github/workflows/validate.yml"
  push:
    branches: [main]
    paths:
      - "eu/**"
      - "us/**"
      - ".github/schema/**"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate source files
        run: uv run .github/scripts/validate.py

      - name: Build artifacts
        run: uv run .github/scripts/build.py --version 0.0.0-ci

  diff:
    # Show reviewers exactly which IPs a PR adds or removes, so nobody has to read raw JSON.
    # Informational only: `validate` is the gate, so a baseline that cannot be rebuilt
    # (an old branch, a schema change) must never block the PR.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build this branch
        run: |
          uv run .github/scripts/build.py --version "pr-${{ github.event.pull_request.number }}"
          cp dist/eu.json dist/us.json "${RUNNER_TEMP}/"

      - name: Build the base branch
        run: |
          # main predates eu/ and us/. An empty baseline still produces a useful
          # "everything added" comment instead of failing the checkout.
          mkdir -p "${RUNNER_TEMP}/old"
          base="origin/${{ github.base_ref }}"
          if git cat-file -e "${base}:eu/ip-ranges.json" \
            && git cat-file -e "${base}:us/ip-ranges.json"; then
            git checkout "$base" -- eu us
            uv run .github/scripts/build.py --version "${{ github.base_ref }}"
            cp dist/eu.json dist/us.json "${RUNNER_TEMP}/old/"
            git checkout HEAD -- eu us
          else
            echo "Base branch has no eu/ or us/ ip-ranges yet; diffing against an empty list."
            printf '%s\n' '{"endpoints":[]}' > "${RUNNER_TEMP}/old/eu.json"
            printf '%s\n' '{"endpoints":[]}' > "${RUNNER_TEMP}/old/us.json"
          fi

      - name: Render diff
        run: |
          uv run .github/scripts/release_notes.py \
            --version "pr-${{ github.event.pull_request.number }}" \
            --eu "${RUNNER_TEMP}/eu.json" \
            --us "${RUNNER_TEMP}/us.json" \
            --old-eu "${RUNNER_TEMP}/old/eu.json" \
            --old-us "${RUNNER_TEMP}/old/us.json" \
            --out "${RUNNER_TEMP}/diff.md"

          {
            echo "<!-- ip-ranges-diff -->"
            echo "## Proposed IP changes"
            echo
            tail -n +2 "${RUNNER_TEMP}/diff.md"
          } > "${RUNNER_TEMP}/comment.md"

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file "${RUNNER_TEMP}/comment.md" \
            --edit-last --create-if-none
