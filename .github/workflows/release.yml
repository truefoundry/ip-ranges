name: Release

on:
  push:
    branches: [main]
    paths:
      - "global/**"
      - "us/**"
      - ".github/schema/**"
      - ".github/scripts/**"
      - ".github/pages/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and print the notes without tagging or publishing"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate source files
        run: uv run .github/scripts/validate.py

      - name: Refuse to publish placeholder data
        run: |
          if grep -rqi 'PLACEHOLDER' global/ us/; then
            echo "::error::global/ or us/ still contains PLACEHOLDER entries. Replace them with real IPs before releasing."
            grep -rin 'PLACEHOLDER' global/ us/
            exit 1
          fi

      - name: Pick a CalVer version
        id: version
        run: |
          git fetch --tags --force
          BASE="$(date -u +%Y.%m.%d)"
          # Several releases in one day get -2, -3, ... so tags stay unique and ordered.
          COUNT="$(git tag -l "v${BASE}" "v${BASE}-*" | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            VERSION="$BASE"
          else
            VERSION="${BASE}-$((COUNT + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Fetch the previously released artifacts
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          mkdir -p "${RUNNER_TEMP}/old"
          if [ -n "$PREV" ] && gh release download "$PREV" --pattern global.json --dir "${RUNNER_TEMP}/old" 2>/dev/null; then
            echo "tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "Comparing against $PREV"
          elif [ -n "$PREV" ] && gh release download "$PREV" --pattern eu.json --dir "${RUNNER_TEMP}/old" 2>/dev/null; then
            mv "${RUNNER_TEMP}/old/eu.json" "${RUNNER_TEMP}/old/global.json"
            echo "tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "Comparing against $PREV (published as eu.json)"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No previous release to compare against"
          fi
          if [ -n "$PREV" ]; then
            gh release download "$PREV" --pattern us.json --dir "${RUNNER_TEMP}/old" 2>/dev/null || true
          fi

      - name: Build artifacts
        run: uv run .github/scripts/build.py --version "${{ steps.version.outputs.version }}"

      - name: Write release notes
        id: notes
        run: |
          ARGS=(
            --version "${{ steps.version.outputs.version }}"
            --global dist/global.json
            --us dist/us.json
            --out "${RUNNER_TEMP}/notes.md"
          )
          if [ -f "${RUNNER_TEMP}/old/global.json" ]; then
            ARGS+=(--old-global "${RUNNER_TEMP}/old/global.json")
          fi
          if [ -f "${RUNNER_TEMP}/old/us.json" ]; then
            ARGS+=(--old-us "${RUNNER_TEMP}/old/us.json")
          fi
          uv run .github/scripts/release_notes.py "${ARGS[@]}" >> "$GITHUB_OUTPUT"
          cat "${RUNNER_TEMP}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: echo "::notice::Dry run — notes are in the job summary. Nothing tagged or published."

      - name: Skip when the address list is unchanged
        if: ${{ !inputs.dry_run && steps.notes.outputs.publish != 'true' }}
        run: echo "::notice::No addresses were added or removed. No release published."

      - name: Tag and publish
        if: ${{ !inputs.dry_run && steps.notes.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # gh creates the tag at this commit, so nothing is ever pushed to a protected branch.
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "IP ranges v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest \
            dist/*

      - name: Prepare the GitHub Pages site
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p site
          cp dist/global.json dist/us.json dist/global.txt dist/us.txt site/
          cp .github/pages/index.html site/index.html

      - name: Upload the GitHub Pages artifact
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: release
    if: ${{ !inputs.dry_run && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
