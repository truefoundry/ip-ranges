name: Release

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "schema/**"
      - "scripts/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and print the notes without tagging or publishing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Validate source files
        run: uv run scripts/validate.py

      - name: Refuse to publish placeholder data
        run: |
          if grep -rqi 'PLACEHOLDER' data/; then
            echo "::error::data/ still contains PLACEHOLDER entries. Replace them with real IPs before releasing."
            grep -rin 'PLACEHOLDER' data/
            exit 1
          fi

      - name: Pick a CalVer version
        id: version
        run: |
          git fetch --tags --force
          BASE="$(date -u +%Y.%m.%d)"
          # Several releases in one day get -2, -3, ... so tags stay unique and ordered.
          COUNT="$(git tag -l "v${BASE}" "v${BASE}-*" | wc -l | tr -d ' ')"
          if [ "$COUNT" -eq 0 ]; then
            VERSION="$BASE"
          else
            VERSION="${BASE}-$((COUNT + 1))"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Fetch the previously released artifact
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # dist/ is not tracked in git, so the diff baseline comes from the last release.
          PREV="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -n "$PREV" ] && gh release download "$PREV" \
               --pattern nat-ips.json --output "${RUNNER_TEMP}/old.json" 2>/dev/null; then
            echo "tag=$PREV" >> "$GITHUB_OUTPUT"
            echo "Comparing against $PREV"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "No previous release to compare against"
          fi

      - name: Build artifacts
        run: uv run scripts/build.py --version "${{ steps.version.outputs.version }}"

      - name: Write release notes
        run: |
          ARGS=(--new dist/nat-ips.json --out "${RUNNER_TEMP}/notes.md")
          if [ -n "${{ steps.previous.outputs.tag }}" ]; then
            ARGS+=(--old "${RUNNER_TEMP}/old.json")
          fi
          uv run scripts/release_notes.py "${ARGS[@]}"
          cat "${RUNNER_TEMP}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop here on a dry run
        if: inputs.dry_run
        run: echo "::notice::Dry run — notes are in the job summary. Nothing tagged or published."

      - name: Tag and publish
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # gh creates the tag at this commit, so nothing is ever pushed to a protected branch.
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "NAT IPs v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --latest \
            dist/*
